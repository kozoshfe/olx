<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор описів ноутбуків</title>
<style>
:root{
  --bg:#091121;
  --bg2:#0d1730;
  --panel:#101b35;
  --panel-2:#132142;
  --text:#eef3ff;
  --muted:#97a7cb;
  --line:rgba(255,255,255,.08);
  --blue:#4f87ff;
  --blue2:#2e67da;
  --green:#22c55e;
  --shadow:0 24px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 14% 0%, rgba(89,122,255,.12), transparent 24%),
    radial-gradient(circle at 100% 0%, rgba(82,162,255,.08), transparent 20%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}
body{padding:24px}
button,input,select,textarea{font:inherit}
.container{max-width:1260px;margin:auto}
.header{
  margin-bottom:18px;
  padding:26px;
  border:1px solid var(--line);
  border-radius:30px;
  background:linear-gradient(180deg,rgba(19,31,61,.96),rgba(15,25,48,.96));
  box-shadow:var(--shadow);
}
.header h1{
  margin:0 0 8px;
  font-size:36px;
  line-height:.95;
  letter-spacing:-.04em;
}
.header p{
  margin:0;
  color:var(--muted);
  font-size:15px;
  line-height:1.5;
  max-width:760px;
}
.switcher-wrap{margin-top:18px;display:flex;justify-content:flex-start}
.switcher{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:8px;
  background:rgba(9,18,39,.65);
  border:1px solid var(--line);
  border-radius:24px;
}
.switch-btn{
  border:none;
  min-height:54px;
  border-radius:18px;
  padding:0 20px;
  font-weight:850;
  cursor:pointer;
  background:transparent;
  color:#b9c7e7;
  transition:.18s ease;
}
.switch-btn.active{
  background:linear-gradient(180deg,rgba(81,104,158,.82),rgba(58,76,118,.82));
  color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.generator-view{display:none}
.generator-view.active{display:block}
.layout{display:grid;grid-template-columns:420px 1fr;gap:18px;margin-top:18px}
.card{
  background:linear-gradient(180deg,rgba(18,29,57,.96),rgba(14,24,46,.96));
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
}
.form-card{padding:22px}
.output-card{padding:22px;display:flex;flex-direction:column}
.section-title{
  margin:0 0 14px;
  font-size:20px;
  font-weight:850;
  letter-spacing:-.02em;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{
  color:#9fb0cf;
  font-size:12px;
  font-weight:800;
  letter-spacing:.02em;
}
select,input,textarea{
  width:100%;
  padding:13px 14px;
  border-radius:16px;
  border:1px solid var(--line);
  background:#0c1630;
  color:var(--text);
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
select:focus,input:focus,textarea:focus{
  border-color:rgba(79,135,255,.58);
  box-shadow:0 0 0 4px rgba(79,135,255,.12);
}
textarea{
  min-height:420px;
  resize:vertical;
  line-height:1.58;
}
.btn{
  border:none;
  border-radius:18px;
  min-height:52px;
  padding:0 18px;
  cursor:pointer;
  font-weight:850;
  transition:.18s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{
  background:linear-gradient(180deg,var(--blue),var(--blue2));
  color:#f8fbff;
  box-shadow:0 16px 28px rgba(34,79,181,.28);
}
.btn-secondary{
  background:linear-gradient(180deg,rgba(26,42,75,.96),rgba(17,30,58,.96));
  color:#dce7ff;
  border:1px solid rgba(122,150,212,.16);
}
.btn-success{
  background:linear-gradient(180deg,#25cf66,#169a49);
  color:#fff;
}
.actions{display:grid;gap:10px;margin-top:16px}
.output-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.output-top h2{margin:0;font-size:22px}
.copy-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-height:38px;
  padding:0 12px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  color:#b8c7e6;
  font-size:12px;
  border:1px solid var(--line);
  font-weight:800;
}
.footer-note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45}
.word-layout{display:grid;grid-template-columns:420px 1fr;gap:18px;margin-top:18px}
.word-preview{
  background:#fff;color:#151515;border-radius:18px;padding:24px;
  min-height:680px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);font-family:Arial,sans-serif;
}
.word-preview-sheet{display:grid;grid-template-columns:1fr 1fr;gap:24px 38px}
.checklist{font-size:12px;line-height:1.3}
.checklist-row{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:baseline;margin:0 0 8px}
.checklist-row.line-row{margin-top:17px}
.checklist-row.spaced{margin-top:18px}
.checklist-line{border-bottom:1px solid #333;min-height:14px}
.choice{display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:7px 18px}
.choice span{white-space:nowrap}
.word-preview .checklist-form{width:100%;min-height:390px;border-collapse:collapse;table-layout:fixed;border:1px solid #aeb9c9;color:#151515;font-size:11px;line-height:1.15}
.word-preview .col-number{width:7%}
.word-preview .col-label{width:53%}
.word-preview .col-entry{width:40%}
.word-preview .form-title{padding:6px 7px 5px;background:#e8eef7;color:#314568;font-size:9px;font-weight:800;letter-spacing:.02em;border-bottom:1px solid #aeb9c9}
.word-preview .field-number{width:5%;padding:5px 0 4px 3px;vertical-align:top;color:#63718a;font-weight:800}
.word-preview .field-label{width:55%;padding:5px 3px 4px 0;vertical-align:top}
.word-preview .field-entry{width:40%;padding:5px 5px 4px 2px;vertical-align:top}
.word-preview .field-entry-line{border-bottom:1px solid #334155;height:42px}
.word-preview .field-row td{border-bottom:1px solid #d7deea}
.word-preview .field-row-last td{border-bottom:0}
.word-preview .line-label-row td{border-bottom:0;padding-bottom:1px}
.word-preview .line-write-row td{padding-top:0}
.word-preview .writing-line{padding:0 5px 2px;vertical-align:top}
.word-preview .writing-rule{height:23px;border-bottom:1px solid #334155}
.word-preview .options-table{width:100%;border-collapse:collapse;table-layout:fixed}
.word-preview .option-cell{width:50%;padding:0 2px 2px 0;white-space:nowrap;vertical-align:top}
.word-preview .box{font-size:12px;vertical-align:-1px}
.word-preview-title{margin:0 0 14px;font-size:13px;color:#63718b;font-weight:800}
.checklist-editor{display:grid;gap:10px}
.checklist-item{padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(7,15,35,.38)}
.checklist-item-top{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}
.checklist-item-top input{padding:10px 12px;border-radius:12px}
.item-type{display:flex;gap:6px;margin-top:9px;align-items:center;flex-wrap:wrap}
.type-btn{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#0c1630;color:#b9c7e7;font-size:12px;font-weight:800;cursor:pointer}
.type-btn.active{background:rgba(79,135,255,.28);border-color:rgba(79,135,255,.7);color:#fff}
.item-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px}.item-options input{padding:9px 11px;border-radius:11px}
.option-count{margin-left:auto;display:flex;align-items:center;gap:7px;color:#97a7cb;font-size:12px;font-weight:800}.option-count select{width:auto;padding:6px 8px;border-radius:9px;font-size:12px}
.item-delete{border:0;border-radius:10px;width:34px;height:34px;background:rgba(239,68,68,.15);color:#ff9d9d;font-size:18px;cursor:pointer}
.add-item{width:100%;border:1px dashed rgba(122,150,212,.45);border-radius:14px;min-height:44px;background:transparent;color:#c8d7f5;font-weight:800;cursor:pointer}
@media (max-width:980px){.word-layout{grid-template-columns:1fr}}
@media (max-width:640px){.word-preview{padding:14px;overflow:auto}.word-preview-sheet{min-width:590px;gap:20px}}
.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#112042;
  color:#fff;
  border:1px solid var(--line);
  padding:12px 14px;
  border-radius:14px;
  box-shadow:var(--shadow);
  opacity:0;
  transform:translateY(10px);
  pointer-events:none;
  transition:.2s ease;
  z-index:100;
}
.toast.show{opacity:1;transform:translateY(0)}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:640px){
  body{padding:14px}
  .header{padding:18px}
  .header h1{font-size:28px}
  .form-card,.output-card{padding:16px}
  .grid{grid-template-columns:1fr}
  .copy-row{grid-template-columns:1fr}
  .switcher{width:100%}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Генератор описів ноутбуків</h1>
    <div class="switcher-wrap">
      <div class="switcher">
        <button class="switch-btn active" data-view="olxView" type="button">OLX генератор</button>
        <button class="switch-btn" data-view="tgView" type="button">Telegram генератор</button>
        <button class="switch-btn" data-view="wordView" type="button">Чек-лист</button>
      </div>
    </div>
  </div>

  <section id="olxView" class="generator-view active">
    <div class="layout">
      <div class="card form-card">
        <h2 class="section-title">Параметри ноутбука</h2>
        <div class="grid">
          <div class="field">
            <label for="olx_type">Тип</label>
            <select id="olx_type"><option>Ноутбук</option><option>Потужний</option></select>
          </div>
          <div class="field">
            <label for="olx_model">Модель</label>
            <select id="olx_model"><option>HP EliteBook 850 G7</option><option>HP Zbook G4</option><option>HP Zbook G5</option><option>HP Zbook G6</option><option>Інше</option></select>
          </div>
          <div class="field full" id="olx_model_custom_wrap" style="display:none;">
            <label for="olx_model_custom">Своя модель</label>
            <input id="olx_model_custom" placeholder="Введіть назву моделі">
          </div>
          <div class="field">
            <label for="olx_cpu">Процесор</label>
            <select id="olx_cpu"><option>i5-10210U</option><option>i5-10310U</option><option>i7-8750H</option><option>i7-9850H</option><option>i7-7820HQ</option><option>Інше</option></select>
          </div>
          <div class="field full" id="olx_cpu_custom_wrap" style="display:none;">
            <label for="olx_cpu_custom">Свій процесор</label>
            <input id="olx_cpu_custom" placeholder="Введіть назву процесора">
          </div>
          <div class="field">
            <label for="olx_ram">Оперативна памʼять</label>
            <select id="olx_ram"><option>16 Гб DDR4</option><option>32 Гб DDR4</option></select>
          </div>
          <div class="field">
            <label for="olx_ssd">Накопичувач</label>
            <select id="olx_ssd"><option>256 SSD</option><option>512 SSD</option><option>1024 SSD</option></select>
          </div>
          <div class="field">
            <label for="olx_gpu">Відеокарта</label>
            <select id="olx_gpu"><option>HD Graphics 620</option><option>NVIDIA Quadro M2200 4GB</option><option>Nvidia Quadro P2000 4GB</option><option>Nvidia Quadro P1000 4GB</option><option>Nvidia Quadro T2000 4GB</option><option>Nvidia Quadro T1000 4GB</option><option>Інше</option></select>
          </div>
          <div class="field full" id="olx_gpu_custom_wrap" style="display:none;">
            <label for="olx_gpu_custom">Своя відеокарта</label>
            <input id="olx_gpu_custom" placeholder="Введіть назву відеокарти">
          </div>
          <div class="field">
            <label for="olx_code">Код товару</label>
            <input id="olx_code" placeholder="Наприклад: 200">
          </div>
          <div class="field">
            <label for="olx_battery">Батарея, %</label>
            <input id="olx_battery" placeholder="Наприклад: 86">
          </div>
          <div class="field">
            <label for="olx_price">Ціна</label>
            <input id="olx_price" placeholder="Наприклад: 12500">
          </div>
          <div class="field full">
            <label for="olx_state">Стан</label>
            <select id="olx_state"><option>9/10</option><option>8/10</option><option>Як новий</option></select>
          </div>
          <div class="field full" style="flex-direction:row;align-items:center;gap:10px;">
            <input type="checkbox" id="olx_backlight" checked style="width:auto;padding:0;">
            <label for="olx_backlight" style="margin:0;">Підсвітка (клавіатура з підсвіткою)</label>
          </div>
          <div class="field full" style="flex-direction:row;align-items:center;gap:10px;">
            <input type="checkbox" id="olx_defect" style="width:auto;padding:0;">
            <label for="olx_defect" style="margin:0;">Дефект</label>
          </div>
          <div class="field full" id="olx_defect_text_wrap" style="display:none;">
            <label for="olx_defect_text">Текст дефекту</label>
            <input id="olx_defect_text" placeholder="Наприклад: є подряпина на кришці">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="generateOlx()">Згенерувати OLX</button>
        </div>
      </div>

      <div class="card output-card">
        <div class="output-top">
          <h2>Результат OLX</h2>
          <div class="badge">⚡ Заголовок + опис</div>
        </div>
        <div class="field">
          <label for="olx_titleField">Заголовок</label>
          <div class="copy-row">
            <input id="olx_titleField" readonly placeholder="Тут буде заголовок">
            <button class="btn btn-secondary" onclick="copyField('olx_titleField','Заголовок скопійовано')">Копіювати</button>
          </div>
        </div>
        <div class="field" style="margin-top:14px; flex:1;">
          <label for="olx_result">Опис</label>
          <textarea id="olx_result" placeholder="Тут буде згенерований опис"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-success" onclick="copyField('olx_result','Опис скопійовано')">Копіювати опис</button>
        </div>
      </div>
    </div>
  </section>

  <section id="tgView" class="generator-view">
    <div class="layout">
      <div class="card form-card">
        <h2 class="section-title">Параметри ноутбука</h2>
        <div class="grid">
          <div class="field full">
            <label for="tg_model">💻 Модель</label>
            <select id="tg_model"><option>HP EliteBook 850 G7</option><option selected>HP Zbook 15 G4</option><option>HP Zbook 15 G5</option><option>HP Zbook 15 G6</option><option>Інше</option></select>
          </div>
          <div class="field full" id="tg_model_custom_wrap" style="display:none;">
            <label for="tg_model_custom">Своя модель</label>
            <input id="tg_model_custom" placeholder="Введіть назву моделі">
          </div>
          <div class="field">
            <label for="tg_number">🔢 Номер ноутбука</label>
            <input type="text" id="tg_number" value="144">
          </div>
          <div class="field">
            <label for="tg_cpu">🛠 Процесор</label>
            <select id="tg_cpu"><option>i5-10210U</option><option>i5-10310U</option><option selected>i7-8750H</option><option>i7-9850H</option><option>i7-7820HQ</option><option>Інше</option></select>
          </div>
          <div class="field full" id="tg_cpu_custom_wrap" style="display:none;">
            <label for="tg_cpu_custom">Свій процесор</label>
            <input id="tg_cpu_custom" placeholder="Введіть назву процесора">
          </div>
          <div class="field">
            <label for="tg_ram">🧠 ОЗП</label>
            <select id="tg_ram"><option>16 ГБ</option><option selected>32 ГБ</option></select>
          </div>
          <div class="field">
            <label for="tg_disk">💾 Диск</label>
            <select id="tg_disk"><option>256 ГБ</option><option selected>512 ГБ</option><option>1024 ГБ</option></select>
          </div>
          <div class="field">
            <label for="tg_gpu">🎮 Відеокарта</label>
            <select id="tg_gpu"><option>HD Graphics 620</option><option>NVIDIA Quadro M2200 4GB</option><option>Nvidia Quadro P2000 4GB</option><option>Nvidia Quadro P1000 4GB</option><option>Nvidia Quadro T2000 4GB</option><option>Nvidia Quadro T1000 4GB</option><option>Інше</option></select>
          </div>
          <div class="field full" id="tg_gpu_custom_wrap" style="display:none;">
            <label for="tg_gpu_custom">Своя відеокарта</label>
            <input id="tg_gpu_custom" placeholder="Введіть назву відеокарти">
          </div>
          <div class="field">
            <label for="tg_battery">🔋 Стан батареї (%)</label>
            <input type="text" id="tg_battery" value="85">
          </div>
          <div class="field">
            <label for="tg_condition">🌟 Стан</label>
            <select id="tg_condition"><option selected>8/10</option><option>9/10</option><option>Як новий</option></select>
          </div>
          <div class="field full" style="flex-direction:row;align-items:center;gap:10px;">
            <input type="checkbox" id="tg_defect" style="width:auto;padding:0;">
            <label for="tg_defect" style="margin:0;">Дефект</label>
          </div>
          <div class="field full" id="tg_defect_text_wrap" style="display:none;">
            <label for="tg_defect_text">Текст дефекту</label>
            <input id="tg_defect_text" placeholder="Тут дефект">
          </div>
          <div class="field">
            <label for="tg_price">💸 Ціна</label>
            <input type="text" id="tg_price" value="12500">
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="generateTelegram()">Згенерувати Telegram</button>
        </div>
      </div>

      <div class="card output-card">
        <div class="output-top">
          <h2>Результат Telegram</h2>
          <div class="badge">⚡ Готовий текст</div>
        </div>
        <div class="field" style="flex:1;">
          <label for="tg_result">Текст</label>
          <textarea id="tg_result" placeholder="Тут буде готовий текст"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-success" onclick="copyField('tg_result','Текст скопійовано')">Копіювати текст</button>
        </div>
      </div>
    </div>
  </section>

  <section id="wordView" class="generator-view">
    <div class="word-layout">
      <div class="card form-card">
        <h2 class="section-title">Чек-лист перевірки ноутбука</h2>
        <div class="grid">
          <div class="field full"><label>Пункти чек-листа</label><div id="checklist_editor" class="checklist-editor"></div><button class="add-item" type="button" onclick="addChecklistItem()">＋ Додати пункт</button></div>
        </div>
        <div class="actions">
          <button class="btn btn-success" onclick="downloadWordChecklist()">Завантажити Word (.docx)</button>
        </div>
      </div>
      <div class="card output-card">
        <div class="output-top"><h2>Попередній перегляд</h2><div class="badge">📄 4 чек-листи · A4</div></div>
        <div class="word-preview"><p id="word_preview_title" class="word-preview-title">Так виглядатиме сторінка у Word</p><div id="word_preview" class="word-preview-sheet"></div></div>
      </div>
    </div>
  </section>
</div>

<div id="toast" class="toast">Скопійовано</div>

<script>

function toggleCustomField(prefix, field){
  const select = document.getElementById(prefix + '_' + field);
  const wrap = document.getElementById(prefix + '_' + field + '_custom_wrap');
  if(!select || !wrap) return;
  wrap.style.display = select.value === 'Інше' ? '' : 'none';
}

function toggleDefectField(prefix){
  const checkbox = document.getElementById(prefix + '_defect');
  const wrap = document.getElementById(prefix + '_defect_text_wrap');
  if(!checkbox || !wrap) return;
  wrap.style.display = checkbox.checked ? '' : 'none';
}

function syncSharedFields(changedId){
  const pairs = {
    olx_model: 'tg_model',
    olx_cpu: 'tg_cpu',
    olx_ram: 'tg_ram',
    olx_ssd: 'tg_disk',
    olx_gpu: 'tg_gpu',
    olx_gpu_custom: 'tg_gpu_custom',
    tg_gpu_custom: 'olx_gpu_custom',
    olx_code: 'tg_number',
    olx_battery: 'tg_battery',
    olx_price: 'tg_price',
    olx_state: 'tg_condition',
    olx_defect: 'tg_defect',
    olx_defect_text: 'tg_defect_text',
    olx_model_custom: 'tg_model_custom',
    tg_model_custom: 'olx_model_custom',
    olx_cpu_custom: 'tg_cpu_custom',
    tg_cpu_custom: 'olx_cpu_custom',
    tg_model: 'olx_model',
    tg_cpu: 'olx_cpu',

function normalizeChecklistItems(items){
  if(!Array.isArray(items)) return null;
  return items.map(item => ({
    label: String(item.label || ''),
    type: item.type === 'options' ? 'options' : 'line',
    options: Array.isArray(item.options) ? item.options.map(option => String(option || '')) : ['Так', 'Ні']
  }));
}
function loadChecklistItems(){
  try{

}

    if(item.options.toLowerCase() === 'лінія') return `<tr class="line-label-row"><td class="field-number">${index + 1}.</td><td class="field-label" colspan="2">${escapeHtml(item.label)}</td></tr><tr class="${rowClass} line-write-row"><td colspan="3" class="writing-line"><div class="writing-rule">&nbsp;</div></td></tr>`;
    const choices = item.options.split(',').map(option => option.trim()).filter(Boolean);
    return `<tr class="${rowClass}"><td class="field-number">${index + 1}.</td><td class="field-label">${escapeHtml(item.label)}</td><td class="field-entry">${buildWordOptionsHtml(choices)}</td></tr>`;
  }).join('')}</table>`;
}
function escapeXml(value){
  return String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[char]));
}
function wordRunXml(text, options = {}){

}
function wordParagraphXml(text, options = {}){
  const align = options.align ? `<w:jc w:val="${options.align}"/>` : '';
  return `<w:p><w:pPr>${align}<w:spacing w:before="0" w:after="0" w:line="220" w:lineRule="auto"/></w:pPr>${wordRunXml(text, options)}</w:p>`;
}
function wordCellXml(content, width, options = {}){
  const gridSpan = options.gridSpan ? `<w:gridSpan w:val="${options.gridSpan}"/>` : '';
  const shade = options.shade ? `<w:shd w:fill="${options.shade}"/>` : '';

  const bordersNil = options.bordersNil ? '<w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders>' : '';

  const marginXml = `<w:tcMar><w:top w:w="${margin.top}" w:type="dxa"/><w:right w:w="${margin.right}" w:type="dxa"/><w:bottom w:w="${margin.bottom}" w:type="dxa"/><w:left w:w="${margin.left}" w:type="dxa"/></w:tcMar>`;
  return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${gridSpan}${shade}${bottomBorder}${bordersNil}${marginXml}<w:vAlign w:val="top"/></w:tcPr>${content}</w:tc>`;
}
function wordTableBordersXml(){
  return '<w:tblBorders><w:top w:val="single" w:sz="6" w:space="0" w:color="9AA7BB"/><w:left w:val="single" w:sz="6" w:space="0" w:color="9AA7BB"/><w:bottom w:val="single" w:sz="6" w:space="0" w:color="9AA7BB"/><w:right w:val="single" w:sz="6" w:space="0" w:color="9AA7BB"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="D7DEEA"/><w:insideV w:val="nil"/></w:tblBorders>';
}
function wordNoTableBordersXml(){
  return '<w:tblBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/><w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>';
}
function buildChecklistDocxTableXml(){
  const items = wordLabels();
  const numberWidth = 365;
  const labelWidth = 2755;
  const entryWidth = 2080;
  const tableWidth = numberWidth + labelWidth + entryWidth;
  const rows = [
    `<w:tr><w:trPr><w:trHeight w:val="330" w:hRule="atLeast"/></w:trPr>${wordCellXml(wordParagraphXml('ЧЕК-ЛИСТ ПЕРЕВІРКИ НОУТБУКА', {bold:true, color:'233B60', size:16}), tableWidth, {gridSpan:3, shade:'E8EEF7'})}</w:tr>`
  ];

  items.forEach((item, index) => {
    if(item.options.toLowerCase() === 'лінія'){
      rows.push(`<w:tr><w:trPr><w:trHeight w:val="260" w:hRule="atLeast"/></w:trPr>${wordCellXml(wordParagraphXml(`${index + 1}. ${item.label}`, {size:17}), tableWidth, {gridSpan:3})}</w:tr>`);
      rows.push(`<w:tr><w:trPr><w:trHeight w:val="310" w:hRule="atLeast"/></w:trPr>${wordCellXml(wordParagraphXml(' ', {size:17}), tableWidth, {gridSpan:3, bottomBorder:true, margin:{top:0, right:70, bottom:20, left:70}})}</w:tr>`);
      return;
    }

    const choices = item.options.split(',').map(option => option.trim()).filter(Boolean);
    const choicesText = choices.map(choice => `☐ ${choice}`).join('     ');
    rows.push(`<w:tr><w:trPr><w:trHeight w:val="330" w:hRule="atLeast"/></w:trPr>${wordCellXml(wordParagraphXml(`${index + 1}.`, {bold:true, color:'63718A', size:17}), numberWidth)}${wordCellXml(wordParagraphXml(item.label, {size:17}), labelWidth)}${wordCellXml(wordParagraphXml(choicesText, {size:17}), entryWidth)}</w:tr>`);
  });

  return `<w:tbl><w:tblPr><w:tblW w:w="${tableWidth}" w:type="dxa"/><w:tblLayout w:type="fixed"/>${wordTableBordersXml()}<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:left w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${numberWidth}"/><w:gridCol w:w="${labelWidth}"/><w:gridCol w:w="${entryWidth}"/></w:tblGrid>${rows.join('')}</w:tbl>`;
}
function buildChecklistDocumentXml(){
  const checklist = buildChecklistDocxTableXml();
  const pageWidth = 11906;
  const pageHeight = 16838;
  const margin = 360;
  const contentWidth = pageWidth - (margin * 2);
  const slotWidth = Math.floor(contentWidth / 2);
  const outerCellMarginLeft = 70;
  const outerCellMarginRight = 210;
  const outerCellMarginBottom = 240;
  const outerCell = (right = false) => wordCellXml(`${checklist}${wordParagraphXml(' ', {size:2})}`, slotWidth, {
    bordersNil:true,
    margin:{
      top:0,
      right:right ? 0 : outerCellMarginRight,
      bottom:outerCellMarginBottom,
      left:right ? outerCellMarginLeft : 0
    }
  });
  const outerTable = `<w:tbl><w:tblPr><w:tblW w:w="${contentWidth}" w:type="dxa"/><w:tblLayout w:type="fixed"/>${wordNoTableBordersXml()}<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:left w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${slotWidth}"/><w:gridCol w:w="${contentWidth - slotWidth}"/></w:tblGrid><w:tr>${outerCell(false)}${outerCell(true)}</w:tr><w:tr>${outerCell(false)}${outerCell(true)}</w:tr></w:tbl>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${outerTable}<w:sectPr><w:pgSz w:w="${pageWidth}" w:h="${pageHeight}"/><w:pgMar w:top="${margin}" w:right="${margin}" w:bottom="${margin}" w:left="${margin}" w:header="${margin}" w:footer="${margin}" w:gutter="0"/></w:sectPr></w:body></w:document>`;
}
function buildChecklistStylesXml(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="18"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:before="0" w:after="0" w:line="220" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>';
}
function concatUint8Arrays(parts){
  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const output = new Uint8Array(total);
  let offset = 0;
  parts.forEach(part => {
    output.set(part, offset);
    offset += part.length;
  });
  return output;
}
const zipCrcTable = (() => {
  const table = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function zipCrc32(data){
  let crc = 0xffffffff;
  for(let i = 0; i < data.length; i++) crc = zipCrcTable[(crc ^ data[i]) & 0xff] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}
function zipUint16(value){
  return new Uint8Array([value & 0xff, (value >>> 8) & 0xff]);
}
function zipUint32(value){
  return new Uint8Array([value & 0xff, (value >>> 8) & 0xff, (value >>> 16) & 0xff, (value >>> 24) & 0xff]);
}
function createZipBlob(files, type){
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(file => {
    const name = encoder.encode(file.name);
    const data = typeof file.content === 'string' ? encoder.encode(file.content) : file.content;
    const crc = zipCrc32(data);
    const date = 33;
    const time = 0;
    const localHeader = concatUint8Arrays([
      zipUint32(0x04034b50), zipUint16(20), zipUint16(0), zipUint16(0), zipUint16(time), zipUint16(date),
      zipUint32(crc), zipUint32(data.length), zipUint32(data.length), zipUint16(name.length), zipUint16(0), name
    ]);
    const centralHeader = concatUint8Arrays([
      zipUint32(0x02014b50), zipUint16(20), zipUint16(20), zipUint16(0), zipUint16(0), zipUint16(time), zipUint16(date),
      zipUint32(crc), zipUint32(data.length), zipUint32(data.length), zipUint16(name.length), zipUint16(0), zipUint16(0),
      zipUint16(0), zipUint16(0), zipUint32(0), zipUint32(offset), name
    ]);
    localParts.push(localHeader, data);
    centralParts.push(centralHeader);
    offset += localHeader.length + data.length;
  });

  const centralDirectory = concatUint8Arrays(centralParts);
  const end = concatUint8Arrays([
    zipUint32(0x06054b50), zipUint16(0), zipUint16(0), zipUint16(files.length), zipUint16(files.length),
    zipUint32(centralDirectory.length), zipUint32(offset), zipUint16(0)
  ]);
  return new Blob([concatUint8Arrays([...localParts, centralDirectory, end])], {type});
}
function buildChecklistDocxBlob(){
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const documentRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  return createZipBlob([
    {name:'[Content_Types].xml', content:contentTypes},
    {name:'_rels/.rels', content:rootRels},
    {name:'word/_rels/document.xml.rels', content:documentRels},
    {name:'word/document.xml', content:buildChecklistDocumentXml()},
    {name:'word/styles.xml', content:buildChecklistStylesXml()}
  ], 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}
function downloadWordChecklist(){
  const blob = buildChecklistDocxBlob();
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'Чек-лист_ноутбука.docx';
  document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(link.href);
  showToast('DOCX-документ завантажено');
}
